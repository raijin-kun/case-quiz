<title>Field Survival Guides</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Layout: sticky top bar with guide tabs; below it a full-height 3D stage on the left and a scrolling field-manual panel on the right. Stacks on phones. */
  :root {
    --bg: #ecefea; --panel: #f7f9f5; --fg: #19211d; --muted: #5d6a63; --line: #cfd8d2;
    --accent: #0e7c8c; --accent-ink: #ffffff; --warn: #a8441b; --warn-bg: #fbe9df; --bar-h: 56px;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  .app[data-guide="shelter"] { --accent: #3f7a3c; }
  .app[data-guide="zombie"]  { --accent: #8a2f2f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #10171a; --panel: #172025; --fg: #e3eae6; --muted: #94a39c; --line: #28363c;
    --accent: #4fc1d1; --accent-ink: #06161a; --warn: #f0a07a; --warn-bg: #3a2218; color-scheme: dark;
  }
  :root:not([data-theme="light"]) .app[data-guide="shelter"] { --accent: #7fc47a; --accent-ink: #071407; }
  :root:not([data-theme="light"]) .app[data-guide="zombie"]  { --accent: #e07a7a; --accent-ink: #1a0707; } }
  :root[data-theme="dark"] {
    --bg: #10171a; --panel: #172025; --fg: #e3eae6; --muted: #94a39c; --line: #28363c;
    --accent: #4fc1d1; --accent-ink: #06161a; --warn: #f0a07a; --warn-bg: #3a2218; color-scheme: dark;
  }
  :root[data-theme="dark"] .app[data-guide="shelter"] { --accent: #7fc47a; --accent-ink: #071407; }
  :root[data-theme="dark"] .app[data-guide="zombie"]  { --accent: #e07a7a; --accent-ink: #1a0707; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: var(--bar-h); display: flex; align-items: center; gap: 18px; background: var(--panel); border-bottom: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand { font: 700 1.25rem/1 var(--display); letter-spacing: .02em; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; }
  .tab { font: 600 .92rem var(--body); padding: 7px 12px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab.on { color: var(--accent); border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
  .stage { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); height: calc(100svh - var(--bar-h)); min-width: 0; }
  .canvas-wrap, .canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .status { font-size: .88rem; padding: 6px 10px; border-radius: 6px; background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--line); }
  .hint { position: absolute; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); color: var(--muted); font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; pointer-events: none; }
  .panel { background: var(--panel); border-left: 1px solid var(--line); padding-block: 28px 40px;
    padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); min-width: 0; }
  .panel > * + * { margin-top: 18px; }
  h1 { font: 700 2.2rem/1 var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
  .eyebrow { color: var(--accent); font: 600 .85rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
  h2 { font: 600 1.6rem/1.1 var(--display); margin: 0 0 8px; text-wrap: balance; }
  p { margin: 0 0 10px; max-width: 62ch; }
  .steps { display: grid; gap: 4px; }
  .steps button { height: 6px; border: 0; border-radius: 3px; background: var(--line); padding: 0; cursor: pointer; }
  .steps button.done { background: var(--accent); opacity: .5; }
  .steps button.on { background: var(--accent); opacity: 1; }
  :is(button, input, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav { display: flex; gap: 8px; }
  .btn { font: 600 .95rem var(--body); padding: 9px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.hud-btn { background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--fg); border-color: var(--line); backdrop-filter: blur(6px); }
  .btn.hud-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .spec { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .92rem; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .spec dt { color: var(--muted); } .spec dd { margin: 0; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font: 600 .85rem var(--body); padding: 6px 10px 6px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  .chip i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); }
  .chip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .chip:disabled { opacity: .45; cursor: default; }
  .card { border-left: 4px solid var(--accent); padding: 4px 0 4px 14px; }
  .card h3 { font: 600 1.25rem/1.1 var(--display); margin: 0 0 4px; }
  .card .sub { color: var(--muted); font-size: .88rem; margin-bottom: 8px; }
  .card ul { margin: 0; padding-left: 18px; }
  .slider { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: .92rem; }
  .slider label { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }
  .slider input { width: 100%; accent-color: var(--accent); }
  .slider .verdict { color: var(--muted); }
  .warn { background: var(--warn-bg); color: var(--fg); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: 8px; padding: 12px 14px; font-size: .92rem; }
  .warn b { color: var(--warn); }
  .legend { font-size: .82rem; color: var(--muted); }
  @media (max-width: 880px) {
    .grid { grid-template-columns: 1fr; }
    .stage { height: 52svh; }
    .panel { border-left: 0; border-top: 1px solid var(--line); }
    .brand { display: none; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>

  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js":"sha384-qlO/ZugKPxAQUAvTlQoo0QECzxJIJySZmCF/DHdb2Xn/hHndFwX/vfUAC9Hbk6LP",
  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/geometries/ParametricGeometry.js":"sha384-uqgEwYZPCWtQSYX143sZLrwig//MMARVS5AHgheFBcjZyO/i+NETVOMrb6RUT972",
  "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js":"sha384-k7/PyxcXOQ/zfJq1v0TM/CcBLQ2m2NzGg2tfHehdgJGqcY7RBwIP4Ye+ssG+QK1I"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ParametricGeometry } from 'three/addons/geometries/ParametricGeometry.js';
import htm from 'htm';
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ============ shared 3D helpers ============
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function speckle(base, dots, n, r, rep = 3) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < n; i++) { g.fillStyle = dots[i % dots.length]; g.beginPath(); g.ellipse(Math.random()*256, Math.random()*256, r*(0.5+Math.random()), r*(0.3+Math.random()*0.5), Math.random()*3, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const mat = (tex, extra = {}) => new THREE.MeshStandardMaterial({ map:tex, roughness:0.95, emissive:0x000000, ...extra });
const solid = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness:0.85, emissive:0x000000, ...extra });
function stick(a, b, r, m) {
  const d = new THREE.Vector3().subVectors(b, a), s = new THREE.Mesh(new THREE.CylinderGeometry(r, r*1.15, d.length(), 8), m);
  s.position.copy(a).addScaledVector(d, 0.5); s.quaternion.setFromUnitVectors(V(0,1,0), d.clone().normalize()); return s;
}
const revealChildren = (r, obj) => obj.children.forEach((c, i) => c.visible = i < Math.ceil(r*obj.children.length));
const revealScaleY = (r, obj) => obj.scale.y = Math.max(1e-3, r);

// ============ GUIDE 1: bottle water filter ============
const waterGuide = {
  id:'water', title:'Gravity Water Pre-Filter', eyebrow:'Field build · 2-litre bottle', partsLabel:'Materials',
  legend:'A layered sediment-and-charcoal filter built from a plastic bottle. Follow the seven steps; the model fills in as you go.',
  hint:'Drag to rotate · scroll to zoom · click a layer', camera:{ pos:[5.5,2.5,6.5], target:[0,0.8,0], min:4 }, highlight:0x2a6a74,
  toggles:[ { id:'pour', label:'Pour water', enabledWhen:s => s.step === 6 }, { id:'explode', label:'Exploded view' } ],
  params:[],
  parts:[
    { id:'cloth',    name:'Cotton cloth plug',  color:'#efe9dc', size:'2–3 cm deep',  qty:'1 square of cotton cloth, 2 coffee filters, or a handful of cotton balls', geo:{ y0:-0.45, y1:0.0, r:0.5 },
      role:'Holds every layer inside the neck and catches charcoal dust so it does not wash into your cup.',
      tips:['Pack it firmly but not so tight that water cannot drip through.','A coffee filter folded twice works well and is cheap.','Replace it when it turns dark.'] },
    { id:'charcoal', name:'Activated charcoal', color:'#2b2b2f', size:'3–4 cm deep',  qty:'About 1 cup, aquarium or water-filter grade', geo:{ y0:0.0, y1:0.8, r:0.93 },
      role:'Adsorbs chlorine, bad taste, odour and many organic chemicals onto its huge internal surface area.',
      tips:['Rinse in clean water until it stops running black.','Do not use barbecue briquettes; they contain binders and lighter fluid.','Crushed hardwood charcoal from a fire is a weaker substitute.'] },
    { id:'fine',     name:'Fine sand',          color:'#e3c98f', size:'4–5 cm deep',  qty:'About 1½ cups, rinsed', geo:{ y0:0.8, y1:1.7, r:0.93 },
      role:'Traps fine silt and clay. This is the layer that actually clears cloudy water, so it is the thickest.',
      tips:['Play sand or river sand. Rinse until the rinse water is clear.','Beach sand must be rinsed to remove salt.','Flow slows down as this layer loads up; that is normal.'] },
    { id:'coarse',   name:'Coarse sand',        color:'#c3a062', size:'3–4 cm deep',  qty:'About 1 cup, rinsed', geo:{ y0:1.7, y1:2.4, r:0.93 },
      role:'Catches mid-size grit so the fine sand below does not clog in the first few litres.',
      tips:['Builder\'s sharp sand or sieved river sand.','Keep it clearly coarser than the fine layer; grading is what makes the filter work.'] },
    { id:'gravel',   name:'Pea gravel',         color:'#8c8578', size:'3–4 cm deep',  qty:'About 1 cup of 5–10 mm pebbles, rinsed', geo:{ y0:2.4, y1:3.2, r:0.93 },
      role:'Stops leaves, insects and large debris, and spreads the poured water evenly so it does not dig channels through the sand.',
      tips:['Aquarium gravel or washed pebbles from a stream.','Pour onto the gravel gently, never straight onto sand.'] },
  ],
  steps:[
    { title:'Cut the bottle', body:'Take a clean 2-litre PET bottle, peel off the label and cut off the bottom about 5 cm up. Turn it upside down: the neck is now the outlet. Poke three small holes in the cap, or leave the cap off. Stand the bottle in a jar or cup that will catch the water.', spec:{ Bottle:'2 L PET, clean', Tools:'Knife or scissors, nail for cap holes', Catch:'Clean jar or cup' } },
    { title:'Plug the neck', part:'cloth' },
    { title:'Add activated charcoal', part:'charcoal' },
    { title:'Add fine sand', part:'fine' },
    { title:'Add coarse sand', part:'coarse' },
    { title:'Top with gravel', part:'gravel' },
    { title:'Pour and collect', body:'Pour dirty water slowly onto the gravel. It should drip, not stream; a slow drip means the sand is doing its job. Throw away the first two or three batches, which carry charcoal dust and loose sand. Then collect the clear water and boil or treat it before drinking.', spec:{ Removes:'Sediment, silt, colour, odour, chlorine', 'Does not remove':'Bacteria, viruses, dissolved salts, heavy metals', Flow:'About 1 cup every 5–10 min', Lifespan:'Rebuild when flow stops or output tastes off' } },
  ],
  warn:['Not drinking water yet.', ' This filter clears sediment, colour and odour. It does not remove bacteria, viruses or dissolved salts. Boil the output for 1 minute (3 minutes above 2000 m) or use purification tablets before drinking.'],
  emptyCard:'Five cheap materials, graded coarse to fine from top to bottom. Each layer protects the one beneath it from clogging.',
  scene({ scene, setStatus }) {
    scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
    const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(4, 8, 5); scene.add(key);
    const TEX = {
      cloth: speckle('#efe9dc', ['#e2dbcb','#f7f3ea'], 600, 1.2), charcoal: speckle('#2b2b2f', ['#3d3d44','#1a1a1d','#4a4a52'], 500, 3),
      fine: speckle('#e3c98f', ['#d4b67a','#f0dba8'], 1500, 0.8), coarse: speckle('#c3a062', ['#a8843f','#d9b876','#8f6d35'], 700, 2.2),
      gravel: speckle('#8c8578', ['#6e6860','#a9a295','#5a554d','#bdb6a8'], 160, 7),
    };
    Object.values(TEX).forEach(t => t.repeat.set(3, 1));
    const glass = new THREE.MeshPhysicalMaterial({ color:0xdff4f7, transmission:0.9, roughness:0.08, thickness:0.2, transparent:true, opacity:0.45, side:THREE.DoubleSide, depthWrite:false });
    scene.add(new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 4.2, 48, 1, true).translate(0, 2.1, 0), glass),
              new THREE.Mesh(new THREE.CylinderGeometry(1, 0.3, 0.6, 48, 1, true).translate(0, -0.3, 0), glass),
              new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.45, 32, 1, true).translate(0, -0.82, 0), glass),
              new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.7, 1.5, 48, 1, true).translate(0, -2.0, 0), glass),
              new THREE.Mesh(new THREE.CircleGeometry(0.7, 48).rotateX(-Math.PI/2).translate(0, -2.74, 0), glass));
    const cupWater = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.7, 1, 48), new THREE.MeshPhysicalMaterial({ color:0x8fd3e0, transparent:true, opacity:0.6, roughness:0.1 }));
    cupWater.visible = false; scene.add(cupWater);
    const parts = {};
    waterGuide.parts.forEach(L => {
      const h = L.geo.y1 - L.geo.y0, m = new THREE.Mesh(new THREE.CylinderGeometry(L.geo.r, L.geo.r, h, 48), mat(TEX[L.id]));
      m.position.y = L.geo.y0 + h/2; m.userData.reveal = revealScaleY; m.userData.geo = L.geo; parts[L.id] = m; scene.add(m);
    });
    // water particles
    const N = 500, pos = new Float32Array(N*3), col = new Float32Array(N*3);
    const P = Array.from({ length:N }, () => ({ y:-2.4 + Math.random()*6.6, a:Math.random()*6.283, f:Math.random() }));
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); pGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const points = new THREE.Points(pGeo, new THREE.PointsMaterial({ size:0.07, vertexColors:true, transparent:true, opacity:0.9, depthWrite:false }));
    points.visible = false; scene.add(points);
    const DIRTY = new THREE.Color(0x7a5a2a), CLEAN = new THREE.Color(0x9fdcea), topY = 3.2, botY = -0.45, tmp = new THREE.Color();
    let cupLevel = 0;
    return { parts, tick(dt, st) {
      const exploded = st.toggles.explode, pouring = st.toggles.pour;
      Object.values(parts).forEach((m, i) => {
        const g = m.userData.geo, h = g.y1 - g.y0, target = g.y0 + h/2*m.scale.y + (exploded ? i*0.55 : 0);
        m.position.y += (target - m.position.y) * (reduce ? 1 : Math.min(1, dt*8));
      });
      glass.opacity = exploded ? 0.15 : 0.45;
      points.visible = pouring;
      if (!pouring) { cupLevel = 0; cupWater.visible = false; setStatus(exploded ? 'Layers pulled apart. Coarse on top, fine at the bottom.' : ''); return; }
      for (let i = 0; i < N; i++) {
        const p = P[i]; p.y -= dt * (p.y < topY && p.y > botY ? 0.35 : 2.2);
        if (p.y < -2.4) { p.y = 4.2; p.a = Math.random()*6.283; p.f = Math.random(); }
        const r = p.y > 0 ? 0.85 : p.y > -0.6 ? 0.3 + 0.55*(p.y+0.6)/0.6 : p.y > -1.05 ? 0.22 : 0.62;
        pos[i*3] = Math.cos(p.a)*r*p.f; pos[i*3+1] = p.y; pos[i*3+2] = Math.sin(p.a)*r*p.f;
        tmp.copy(DIRTY).lerp(CLEAN, THREE.MathUtils.clamp((topY - p.y)/(topY - botY), 0, 1)); col[i*3] = tmp.r; col[i*3+1] = tmp.g; col[i*3+2] = tmp.b;
      }
      pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
      cupLevel = Math.min(1.2, cupLevel + dt*0.05);
      cupWater.visible = cupLevel > 0.02; cupWater.scale.y = cupLevel; cupWater.position.y = -2.74 + cupLevel/2;
      setStatus(cupLevel < 0.3 ? 'Discard the first batches: charcoal dust.' : 'Clear water collecting. Boil it before drinking.');
    } };
  },
};

// ============ GUIDE 2: debris hut shelter ============
const shelterGuide = {
  id:'shelter', title:'Debris Hut Shelter', eyebrow:'Survival build · no tools', partsLabel:'Parts',
  legend:'A one-person insulated shelter built with no tools from a pole, sticks and leaf litter. Seven steps; the model builds as you go.',
  hint:'Drag to rotate · scroll to zoom · click a part', camera:{ pos:[4.6,2.4,4.8], target:[0,0.5,0], min:3, maxPolar:Math.PI/2 - 0.03 }, highlight:0x2c5a2a,
  toggles:[ { id:'rain', label:'Rain test' }, { id:'cut', label:'Cutaway' } ],
  params:[ { id:'thick', label:'Debris thickness', min:20, max:90, step:5, def:60, unit:'cm', showWhen:s => s.built('debris'),
    verdict:cm => cm < 40 ? 'Too thin. You will feel every rib and lose heat all night.' : cm < 60 ? 'Minimum for a mild night. Add more if you can.' : 'Good: an arm\'s length. This is what keeps you warm without a fire.' } ],
  parts:[
    { id:'ridge',   name:'Ridgepole',  color:'#6b4a2e', size:'2.5–3 m long, wrist-thick', qty:'1 straight dead pole, strong enough to stand on',
      role:'The spine of the shelter. One end rests on a stump, rock or forked branch at hip height; the other sits on the ground.',
      tips:['Test it: stand on the middle. If it cracks, find another.','Hip height at the head end gives room to roll over but keeps the air volume small enough to warm.','Point the low end into the prevailing wind.'] },
    { id:'ribs',    name:'Ribbing',    color:'#8a6a45', size:'Thumb-thick sticks, every 10–15 cm', qty:'40–60 sticks, 0.5–1.5 m long',
      role:'Leaned against both sides of the ridgepole at about 45°. They carry the weight of the debris.',
      tips:['Lie down inside first. Set the ribs a hand\'s width from your body; any wider and you will not warm the space.','Do not let ribs stick far above the pole, or rain runs down them into the hut.','Break sticks to length rather than leaving long ends.'] },
    { id:'lattice', name:'Lattice',    color:'#a68a5b', size:'Finger-thick, flexible', qty:'Armfuls of brush, fern fronds, thin branches',
      role:'Woven across the ribs so leaves and needles stay on the roof instead of falling through.',
      tips:['Evergreen boughs work well and add insulation.','It does not need to be neat, only dense enough that debris cannot fall through.'] },
    { id:'debris',  name:'Debris',     color:'#7c6a3c', size:'60–90 cm thick (an arm\'s length)', qty:'Far more than you think: a pile taller than you',

// ============ 3D host shared by all guides ============
function createHost(el, guide, getState, setStatus, onPick) {
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.localClippingEnabled = true; el.appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  camera.position.set(...guide.camera.pos);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(...guide.camera.target); controls.enableDamping = true; controls.minDistance = guide.camera.min ?? 3; controls.maxDistance = 14;
  if (guide.camera.maxPolar) controls.maxPolarAngle = guide.camera.maxPolar;
  const g = guide.scene({ scene, camera, renderer, setStatus });
  const reveal = Object.fromEntries(Object.keys(g.parts).map(k => [k, 0]));
  Object.values(g.parts).forEach(o => o.visible = false);
  let lastSel;
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let downAt = null;
  const onDown = e => downAt = [e.clientX, e.clientY];
  const onUp = e => {
    if (!downAt || Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]) > 6) return;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(Object.values(g.parts).filter(o => o.visible), true)[0];
    if (!hit) return;
    const id = Object.keys(g.parts).find(k => g.parts[k] === hit.object || g.parts[k].getObjectById(hit.object.id));
    if (id) onPick(id);
  };
  renderer.domElement.addEventListener('pointerdown', onDown); renderer.domElement.addEventListener('pointerup', onUp);
  const resize = () => { const w = el.clientWidth, h = el.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); };
  const ro = new ResizeObserver(resize); ro.observe(el); resize();
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05), st = getState();
    for (const [id, obj] of Object.entries(g.parts)) {
      const target = st.built(id) ? 1 : 0;
      reveal[id] = reduce ? target : target > reveal[id] ? Math.min(1, reveal[id] + dt*0.9) : target;
      obj.visible = reveal[id] > 0;
      (obj.userData.reveal || revealScaleY)(reveal[id], obj);
    }
    if (st.selected !== lastSel) {
      lastSel = st.selected;
      for (const [id, obj] of Object.entries(g.parts)) obj.traverse(o => o.material?.emissive?.set(id === lastSel ? guide.highlight : 0x000000));
    }
    g.tick(dt, st); controls.update(); renderer.render(scene, camera);
  });
  return () => { renderer.setAnimationLoop(null); ro.disconnect(); controls.dispose(); renderer.dispose(); renderer.domElement.remove(); };
}

// ============ React UI ============
function Guide({ guide }) {
  const n = guide.steps.length, partStep = id => guide.steps.findIndex(s => s.part === id);
  const [s, setS] = useState({ step:0, selected:null, toggles:{}, params:Object.fromEntries(guide.params.map(p => [p.id, p.def])) });
  const [status, setStatus] = useState('');
  const view = { ...s, built: id => s.step >= partStep(id) };
  view.toggles = Object.fromEntries(guide.toggles.filter(t => s.toggles[t.id] && (!t.enabledWhen || t.enabledWhen(view))).map(t => [t.id, true]));
  const ref = useRef(), stateRef = useRef(view); stateRef.current = view;
  useEffect(() => createHost(ref.current, guide, () => stateRef.current, setStatus, id => setS(x => ({ ...x, selected:id }))), [guide]);
  const setStep = i => setS(x => { const step = (i + n) % n; return { ...x, step, selected: guide.steps[step].part ?? x.selected }; });
  const step = guide.steps[s.step], P = guide.parts.find(p => p.id === step.part), C = guide.parts.find(p => p.id === s.selected);
  return html`
    <div class="grid">
      <div class="stage">
        <div class="canvas-wrap" ref=${ref}></div>
        <div class="hint">${guide.hint}</div>
        <div class="hud">
          ${guide.toggles.map(t => html`<button key=${t.id} class="btn hud-btn" aria-pressed=${String(!!view.toggles[t.id])} disabled=${t.enabledWhen ? !t.enabledWhen(view) : false}
            onClick=${() => setS(x => ({ ...x, toggles:{ ...x.toggles, [t.id]:!x.toggles[t.id] } }))}>${t.label}</button>`)}
          ${status && html`<span class="status">${status}</span>`}
        </div>
      </div>
      <aside class="panel">
        <div>
          <div class="eyebrow">${guide.eyebrow}</div>
          <h1>${guide.title}</h1>
          <p class="legend">${guide.legend}</p>
        </div>
        <div class="steps" role="tablist" aria-label="Build steps" style=${{ gridTemplateColumns:`repeat(${n}, 1fr)` }}>
          ${guide.steps.map((st, i) => html`<button key=${i} role="tab" aria-selected=${String(i === s.step)} aria-label=${`Step ${i+1}: ${st.title}`} class=${(i < s.step ? 'done' : '') + (i === s.step ? ' on' : '')} onClick=${() => setStep(i)}></button>`)}
        </div>
        <div>
          <div class="eyebrow">Step ${s.step+1} of ${n}</div>
          <h2>${step.title}</h2>
          ${P ? html`<p>${P.role}</p><p><b>${P.size}.</b> ${P.qty}.</p>` : html`<p>${step.body}</p>`}
          ${step.note && html`<p>${step.note}</p>`}
          ${step.spec && html`<dl class="spec">${Object.entries(step.spec).map(([k, v]) => html`<dt key=${k}>${k}</dt><dd key=${k+'v'}>${v}</dd>`)}</dl>`}
        </div>
        <div class="nav">
          <button class="btn ghost" disabled=${s.step === 0} onClick=${() => setStep(s.step - 1)}>Back</button>
          <button class="btn" onClick=${() => setStep(s.step + 1)}>${s.step === n-1 ? 'Start over' : 'Next step'}</button>
        </div>
        <div>
          <div class="eyebrow">${guide.partsLabel}</div>
          <div class="chips">
            ${guide.parts.map(p => html`<button key=${p.id} class=${'chip' + (s.selected === p.id ? ' on' : '')} disabled=${!view.built(p.id)} title=${view.built(p.id) ? '' : 'Added in step ' + (partStep(p.id)+1)}
              onClick=${() => setS(x => ({ ...x, selected:p.id }))}><i style=${{ background:p.color }}></i>${p.name}</button>`)}
          </div>
        </div>
        <div class="card">
          ${C ? html`<h3>${C.name}</h3><div class="sub">${C.size} · ${C.qty}</div><p>${C.role}</p><ul>${C.tips.map((t, i) => html`<li key=${i}>${t}</li>`)}</ul>`
              : html`<h3>${guide.partsLabel}</h3><div class="sub">Click a part in the model or a chip above</div><p>${guide.emptyCard}</p>`}
        </div>
        ${guide.params.filter(p => p.showWhen(view)).map(p => html`
          <div key=${p.id} class="slider">
            <label for=${guide.id + '-' + p.id}><span>${p.label}</span><span>${s.params[p.id]} ${p.unit}</span></label>
            <input type="range" id=${guide.id + '-' + p.id} min=${p.min} max=${p.max} step=${p.step} value=${s.params[p.id]} onInput=${e => { const v = +e.target.value; setS(x => ({ ...x, params:{ ...x.params, [p.id]:v } })); }}/>
            <div class="verdict">${p.verdict(s.params[p.id])}</div>
          </div>`)}
        <div class="warn"><b>${guide.warn[0]}</b>${guide.warn[1]}</div>
      </aside>
    </div>`;
}

const fromHash = () => GUIDES.find(g => g.id === location.hash.slice(1)) || GUIDES[0];
function App() {
  const [guide, setGuide] = useState(fromHash);
  useEffect(() => { const h = () => setGuide(fromHash()); addEventListener('hashchange', h); return () => removeEventListener('hashchange', h); }, []);
  return html`
    <div class="app" data-guide=${guide.id}>
      <header class="bar">
        <div class="brand">Field Survival Guides</div>
        <nav class="tabs">${GUIDES.map(g => html`<a key=${g.id} class=${'tab' + (g === guide ? ' on' : '')} href=${'#' + g.id} aria-current=${g === guide ? 'page' : undefined}>${g.title}</a>`)}</nav>
      </header>
      <${Guide} key=${guide.id} guide=${guide} />
    </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
